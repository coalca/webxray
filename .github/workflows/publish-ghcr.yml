name: Publish GHCR image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run checks
        run: |
          npm test
          npm run build:ui

      - name: Read commit version
        id: version
        run: |
          version="$(git show -s --date=format:%y%m%d --format=%cd "$GITHUB_SHA")"
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          test -n "$version"
          test -n "$created"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Smoke test Docker image and bind mount
        shell: bash
        run: |
          data_dir="$(mktemp -d)"
          cleanup() {
            docker rm -f webxray-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --tag webxray:smoke .
          docker run -d --name webxray-smoke -p 127.0.0.1:3000:3000 -v "$data_dir:/data" webxray:smoke
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then
              docker logs webxray-smoke
              exit 1
            fi
            sleep 1
          done
          test -s "$data_dir/config.json"
          test -s "$data_dir/state.json"
          test -x "$data_dir/xray/xray"
          test -s "$data_dir/xray/geoip.dat"
          test -s "$data_dir/xray/geosite.dat"
          token="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$data_dir/config.json')).authToken)")"
          curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:3000/api/state \
            | node -e "let body='';process.stdin.on('data',chunk=>body+=chunk).on('end',()=>{if(!JSON.parse(body).ok)process.exit(1)})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/webxray:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
