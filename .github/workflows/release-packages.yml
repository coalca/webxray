name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 0.2.3
      release_tag:
        description: Existing tag to publish, for example v0.2.0 (leave empty to only build)
        required: false
        default: ''

permissions:
  contents: write

env:
  NODE_VERSION: 24.18.0
  XRAY_VERSION: 26.7.11
  WINSW_VERSION: 2.12.0

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        name: Resolve package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: |
          npm test
          npm run build:ui
          sh -n packaging/build-deb.sh
          sh -n packaging/build-windows.sh
          sh -n packaging/linux/webxray

  deb:
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - deb_arch: amd64
            xray_asset: Xray-linux-64.zip
          - deb_arch: arm64
            xray_asset: Xray-linux-arm64-v8a.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Download Xray
        run: curl --fail --location --retry 3 --output xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/${{ matrix.xray_asset }}"
      - name: Build Deb package
        run: sh packaging/build-deb.sh "${{ needs.metadata.outputs.version }}" "${{ matrix.deb_arch }}" xray.zip dist
      - name: Inspect Deb package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: dist/*.deb

  windows:
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Download Windows runtimes
        run: |
          curl --fail --location --retry 3 --output node.zip "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          curl --fail --location --retry 3 --output xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-windows-64.zip"
          curl --fail --location --retry 3 --output WinSW-x64.exe "https://github.com/winsw/winsw/releases/download/v${WINSW_VERSION}/WinSW-x64.exe"
      - name: Build portable Windows package
        run: sh packaging/build-windows.sh "${{ needs.metadata.outputs.version }}" node.zip xray.zip WinSW-x64.exe dist
      - name: Inspect Windows package
        run: |
          unzip -l dist/*.zip
          unzip -Z1 dist/*.zip | grep -F 'WebXray/WebXray-Run.cmd'
          unzip -Z1 dist/*.zip | grep -F 'WebXray/WebXray-Install-Service.cmd'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [metadata, deb, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "WebXray ${{ needs.metadata.outputs.version }}"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
