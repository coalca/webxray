services:
  webxray:
    build:
      context: .
      args:
        XRAY_IMAGE: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:latest}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: webxray:local
    container_name: webxray
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEBXRAY_AUTH_TOKEN: ${WEBXRAY_AUTH_TOKEN:?Set WEBXRAY_AUTH_TOKEN in .env}
    volumes:
      - webxray-data:/data

volumes:
  webxray-data:
