services:
  webxray:
    image: ${WEBXRAY_IMAGE:-ghcr.io/coalca/webxray:260726}
    pull_policy: always
    container_name: webxray
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEBXRAY_PORT: ${WEBXRAY_API_PORT:-3000}
      WEBXRAY_AUTH_TOKEN: ${WEBXRAY_AUTH_TOKEN:?Set WEBXRAY_AUTH_TOKEN in .env}
      WEBXRAY_CORS_ORIGINS: ${WEBXRAY_CORS_ORIGINS:-}
    volumes:
      - webxray-data:/data

volumes:
  webxray-data:
