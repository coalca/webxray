services:
  webxray:
    build:
      context: .
      args:
        XRAY_IMAGE: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:latest}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: webxray:local
    container_name: webxray
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEBXRAY_AUTH_TOKEN: ${WEBXRAY_AUTH_TOKEN:?Set WEBXRAY_AUTH_TOKEN in .env}
    ports:
      - "${WEBXRAY_WEB_PORT:-3000}:3000"
      - "${WEBXRAY_PROXY_PORT:-10808}:10808/tcp"
      - "${WEBXRAY_PROXY_PORT:-10808}:10808/udp"
    volumes:
      - webxray-data:/data

volumes:
  webxray-data:
